[project]
name = "oportunidades-rd"
version = "0.1.0"
description = "Agente de búsqueda de empleo para la República Dominicana"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alejandro Cimentada", email = "alejandrocimentadaue@gmail.com" }]
dependencies = ["pyyaml>=6.0", "requests>=2.31", "beautifulsoup4>=4.12", "openpyxl>=3.1", "flask>=3.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
